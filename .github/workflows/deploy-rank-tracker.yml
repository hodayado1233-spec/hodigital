name: Deploy rank tracker

# כל שינוי בתיקייה rank-tracker עולה אוטומטית ל-Cloudflare (Worker בשם hodigital-ranks)
on:
  push:
    branches: [claude/focused-ptolemy-udp5mi, main]
    paths: ['rank-tracker/**', '.github/workflows/deploy-rank-tracker.yml']
  workflow_dispatch: {}

concurrency:
  group: deploy-rank-tracker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rank-tracker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rank-tracker/package-lock.json
      - run: npm ci
      - name: Check code
        run: node --check src/index.js && npm run -s build:paste && node --check dist/worker.js
      - name: Missing token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::חסר הסוד CLOUDFLARE_API_TOKEN ב-GitHub (Settings → Secrets and variables → Actions), לכן לא בוצעה העלאה."
      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
