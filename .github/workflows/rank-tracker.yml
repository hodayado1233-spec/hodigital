name: Rank tracker

on:
  schedule:
    - cron: '17 3 * * *' # כל יום ב-06:17 שעון ישראל (קיץ)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rank-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check rankings
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: node rank-tracker/scripts/check-rankings.mjs
      - name: Commit results
        if: always()
        run: |
          git config user.name "rank-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rank-tracker/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Rank tracker: daily scan $(TZ=Asia/Jerusalem date +%F)"
            git push
          fi
