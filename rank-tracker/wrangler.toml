name = "hodigital-ranks"
main = "src/index.js"
compatibility_date = "2026-09-01"
account_id = "e95c74dc3459cf5eaa693c0f26b65971"

# מ-07:00 (שעון ישראל) כל 10 דקות בודקים מה עוד לא עודכן היום: מיקום מדויק (Serper) ונתוני Search Console.
# אחרי שהכול עודכן, הריצות הבאות לא עושות כלום עד מחר.
[triggers]
crons = ["*/10 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "hodigital-ranks"
database_id = "19c738e1-b4de-4c70-bfab-288b62a2d474"

# סודות (מוגדרים ב-Cloudflare, לא בקוד):
#   SERPER_API_KEY      – המפתח מ-serper.dev (מיקום מדויק בגוגל ישראל)
#   GSC_SERVICE_ACCOUNT – כל התוכן של קובץ ה-JSON של ה-Service Account מ-Google Cloud (קליקים וחשיפות, לא חובה)
#   DASHBOARD_PASSWORD  – הסיסמה לדשבורד
