<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>סטודיו דוחות SEO · HODIGITAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=Rubik:wght@500;700;800&display=swap">
<style>
/* Layout: client rail on the right, month editor in the middle as stacked steps that follow the monthly workflow. */
:root{
  --bg:#f6f5f9; --surface:#fff; --surface-2:#efebff; --ink:#0c0a10; --muted:#5b5667; --faint:#8a8496; --line:#e6e3ec;
  --accent:#5a3ff0; --accent-ink:#fff; --pop:#e0468f; --good:#0f8a5f; --good-bg:#e3f6ee; --warn:#9a5b00; --warn-bg:#fff3dc;
  --sans:'IBM Plex Sans Hebrew',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --display:'Rubik','IBM Plex Sans Hebrew',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07060b; --surface:#14111b; --surface-2:#1d1927; --ink:#f3f1f8; --muted:#a39db1; --faint:#7d778b; --line:rgba(255,255,255,.1);
  --accent:#a996ff; --accent-ink:#0c0a10; --pop:#ff6fb5; --good:#4fd6a0; --good-bg:rgba(52,211,153,.12); --warn:#ffc46b; --warn-bg:rgba(255,196,107,.12);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#07060b; --surface:#14111b; --surface-2:#1d1927; --ink:#f3f1f8; --muted:#a39db1; --faint:#7d778b; --line:rgba(255,255,255,.1);
  --accent:#a996ff; --accent-ink:#0c0a10; --pop:#ff6fb5; --good:#4fd6a0; --good-bg:rgba(52,211,153,.12); --warn:#ffc46b; --warn-bg:rgba(255,196,107,.12);
  color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14.5px/1.55 var(--sans)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
@media (max-width:860px){.shell{grid-template-columns:minmax(0,1fr)}}

/* Rail */
.rail{display:grid;gap:14px;align-content:start}
.brand{display:grid;gap:2px}
.brand b{font:800 20px var(--display);letter-spacing:.03em}
.brand span{color:var(--muted);font-size:13px}
.clients{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.clients button{width:100%;text-align:right;background:none;border:1px solid transparent;border-radius:10px;padding:8px 10px;cursor:pointer;display:grid}
.clients button small{color:var(--faint);direction:ltr;text-align:right}
.clients button[aria-current="true"]{background:var(--surface);border-color:var(--line);font-weight:600}
.clients button:hover{background:var(--surface)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.box h3{font-size:14px}

/* Controls */
label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=month],input[type=date],input[type=url],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 10px;color:var(--ink);font-size:14px}
input[type=number]{font-variant-numeric:tabular-nums}
textarea{min-height:84px;resize:vertical;line-height:1.5}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:3px 10px;font-size:12.5px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}

/* Main */
main{display:grid;gap:16px;align-content:start;min-width:0}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
.topbar h1{font-size:26px;font-weight:800}
.topbar .sub{color:var(--muted);direction:ltr;text-align:right}
.step{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px;min-width:0}
.step-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.step-head h2{font-size:18px;font-weight:700;display:flex;gap:10px;align-items:center}
.step-head h2 .n{font:700 13px var(--display);width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;background:var(--surface-2);color:var(--accent)}
.hint{margin:0;color:var(--muted);font-size:13.5px;max-width:78ch}
.hint code,.mono{direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:5px}
details.how{font-size:13.5px;color:var(--muted)}
details.how summary{cursor:pointer;color:var(--accent);font-weight:600}
details.how ol{margin:8px 0 0;padding-inline-start:20px;display:grid;gap:4px}
.status{font-size:12.5px;border-radius:999px;padding:2px 10px;font-weight:600}
.status.ok{background:var(--good-bg);color:var(--good)}
.status.todo{background:var(--warn-bg);color:var(--warn)}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--muted);font-size:13.5px;cursor:pointer;display:block}
.drop.over{border-color:var(--accent);background:var(--surface-2)}
.drop input{display:none}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 11px;background:var(--bg)}
.stat b{font-family:var(--display);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;min-width:0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td input,td select{padding:5px 8px;font-size:13.5px}
td.x{width:1%}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:20}
.toast[hidden]{display:none}
.preview{position:fixed;inset:0;background:rgba(7,6,11,.6);display:grid;place-items:center;z-index:10;padding:16px}
.preview[hidden]{display:none}
.preview .frame{background:var(--bg);border-radius:14px;width:min(1000px,100%);height:min(92vh,100%);display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.preview .bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap}
.preview iframe{width:100%;height:100%;border:0;background:var(--bg)}
.empty-state{padding:40px 20px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand"><b>HODIGITAL</b><span>סטודיו דוחות SEO חודשיים</span></div>
    <ul class="clients" id="clientList"></ul>
    <form class="box" id="newClient">
      <h3>לקוח חדש</h3>
      <label>שם העסק<input type="text" id="ncName" required></label>
      <label>דומיין<input type="text" id="ncDomain" placeholder="www.example.co.il" dir="ltr" required></label>
      <button class="btn primary" type="submit">הוספת לקוח</button>
    </form>
    <div class="box">
      <h3>גיבוי</h3>
      <p class="hint">הנתונים נשמרים רק בדפדפן הזה. כדאי להוריד גיבוי בסוף כל חודש.</p>
      <div class="btns">
        <button class="btn small" id="backupBtn" type="button">הורדת גיבוי</button>
        <label class="btn small" style="display:inline-block;color:inherit">טעינת גיבוי<input type="file" id="restoreInput" accept=".json" hidden></label>
        <button class="btn small ghost" id="demoBtn" type="button">טעינת לקוח לדוגמה</button>
      </div>
    </div>
  </aside>

  <main id="main"></main>
</div>

<div class="preview" id="preview" hidden>
  <div class="frame">
    <div class="bar"><b>תצוגה מקדימה</b><div class="btns"><button class="btn small primary" id="pvDownload" type="button">הורדת הדוח (HTML)</button><button class="btn small" id="pvClose" type="button">סגירה</button></div></div>
    <iframe id="pvFrame" title="תצוגה מקדימה של הדוח"></iframe>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="studio.js"></script>
</body>
</html>
